<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anti-Detect Engine</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --border: #E5E7EB;
      --border-hover: #D1D5DB;
      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --accent: #4F46E5;
      --accent-hover: #4338CA;
      --status-emerald: #10B981;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      padding: 14px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .version-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--status-emerald);
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      transition: border-color 150ms ease;
    }

    .card:hover {
      border-color: var(--border-hover);
    }

    .card-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Custom Device Picker */
    .custom-picker {
      position: relative;
      width: 100%;
    }

    .picker-trigger {
      width: 100%;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 12px;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      outline: none;
      transition: border-color 120ms ease;
    }

    .picker-trigger:hover {
      border-color: var(--border-hover);
    }

    .picker-trigger.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.12);
    }

    .picker-trigger-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .picker-trigger-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .picker-os-badge {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      background: #F1F5F9;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .picker-chevron {
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 120ms ease;
    }

    .picker-trigger.active .picker-chevron {
      transform: rotate(180deg);
    }

    .picker-popover {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      z-index: 999;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      max-height: 250px;
      overflow: hidden;
    }

    .picker-search-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
    }

    .picker-search-bar input {
      border: none;
      background: transparent;
      font-size: 11px;
      outline: none;
      width: 100%;
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    .picker-clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
    }

    .picker-filter-pills {
      display: flex;
      gap: 3px;
      padding: 4px 6px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .filter-pill {
      border: 1px solid transparent;
      background: transparent;
      font-size: 10px;
      color: var(--text-secondary);
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
    }

    .filter-pill:hover {
      background: #F8FAFC;
    }

    .filter-pill.active {
      background: #EEF2FF;
      color: var(--accent);
      border-color: #C7D2FE;
      font-weight: 600;
    }

    .picker-list {
      flex: 1;
      overflow-y: auto;
      max-height: 160px;
    }

    .picker-item {
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid #F1F5F9;
      font-size: 11px;
      user-select: none;
    }

    .picker-item:hover {
      background: #F8FAFC;
    }

    .picker-item.selected {
      background: #EEF2FF;
      color: var(--accent);
      font-weight: 600;
    }

    .picker-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .meta-val {
      font-family: var(--font-mono);
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Network Row */
    .network-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .ip-address {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .ip-geo {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Button */
    .btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      background: #F1F5F9;
      border-color: var(--border-hover);
    }

    .btn-full {
      width: 100%;
      justify-content: center;
      margin-top: 8px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toggles Grid */
    .toggle-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      font-size: 11px;
      color: var(--text-primary);
    }

    /* Minimal Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 26px;
      height: 14px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #CBD5E1;
      border-radius: 14px;
      transition: 150ms;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 10px;
      width: 10px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      border-radius: 50%;
      transition: 150ms;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(12px);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-secondary);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand-title">Anti-Detect Engine</span>
      <span class="version-tag">v1.0.0</span>
    </div>
    <div class="status-indicator">
      <span class="dot"></span>
      <span id="shieldStatus">Active</span>
    </div>
  </div>

  <!-- Device Preset Card -->
  <div class="card">
    <div class="card-label">
      <span>Device Identity</span>
      <span id="presetCategory" style="font-family: var(--font-mono); font-size: 10px;">LAPTOP</span>
    </div>

    <div class="custom-picker" id="devicePickerContainer">
      <button type="button" class="picker-trigger" id="pickerTrigger">
        <div class="picker-trigger-left">
          <span class="picker-trigger-name" id="pickerTriggerName">Select Device Preset...</span>
          <span class="picker-os-badge" id="pickerOsBadge">WIN</span>
        </div>
        <svg class="picker-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <div class="picker-popover" id="pickerPopover" style="display: none;">
        <div class="picker-search-bar">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="pickerSearchInput" placeholder="Search 100 devices...">
          <button type="button" class="picker-clear-btn" id="pickerClearBtn" style="display: none;">&times;</button>
        </div>
        <div class="picker-filter-pills" id="pickerFilterPills">
          <button type="button" class="filter-pill active" data-os="all">All (100)</button>
          <button type="button" class="filter-pill" data-os="win">Win (35)</button>
          <button type="button" class="filter-pill" data-os="mac">Mac (25)</button>
          <button type="button" class="filter-pill" data-os="ios">iOS (20)</button>
          <button type="button" class="filter-pill" data-os="android">Android (20)</button>
        </div>
        <div class="picker-list" id="pickerList"></div>
      </div>
    </div>

    <div class="meta-row">
      <span>Platform</span>
      <span class="meta-val" id="platformVal">-</span>
    </div>
    <div class="meta-row">
      <span>GPU Renderer</span>
      <span class="meta-val" id="gpuVal" style="max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
    </div>
  </div>

  <!-- Network & IP Card -->
  <div class="card">
    <div class="card-label">
      <span>Network & IP</span>
      <span style="font-family: var(--font-mono); font-size: 10px; color: var(--status-emerald);">WEBRTC ISOLATED</span>
    </div>
    <div class="network-row">
      <div>
        <div class="ip-address" id="ipVal">Direct</div>
        <div class="ip-geo" id="geoVal">Detecting network...</div>
      </div>
      <button class="btn" id="btnRotate">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>Rotate IP</span>
      </button>
    </div>
    <div class="meta-row">
      <span>Timezone</span>
      <span class="meta-val" id="tzVal">-</span>
    </div>
  </div>

  <!-- Seed Card -->
  <div class="card">
    <div class="card-label">
      <span>Deterministic Noise Seed</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span class="meta-val" id="seedVal" style="font-size: 13px;">8392819</span>
      <button class="btn" id="btnRegenSeed">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M23 4v6h-6M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <span>Regenerate</span>
      </button>
    </div>
  </div>

  <!-- Quick Module Toggles -->
  <div class="card">
    <div class="card-label">
      <span>Stealth Modules</span>
    </div>
    <div class="toggle-grid">
      <div class="toggle-item">
        <span>WebGL</span>
        <label class="switch">
          <input type="checkbox" id="modWebGL" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <span>Canvas</span>
        <label class="switch">
          <input type="checkbox" id="modCanvas" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <span>Audio</span>
        <label class="switch">
          <input type="checkbox" id="modAudio" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <span>Screen</span>
        <label class="switch">
          <input type="checkbox" id="modScreen" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <span>Timezone</span>
        <label class="switch">
          <input type="checkbox" id="modTimezone" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-item">
        <span>ClientRects</span>
        <label class="switch">
          <input type="checkbox" id="modClientRects" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span>Manifest V3</span>
    <a id="linkOptions">Full Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
